<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binder OS — QA Reports</title>
<style>
:root{
  --bg:#f9fafb;--panel:#ffffff;--panel2:#f3f4f6;--line:#e5e7eb;
  --ink:#111827;--muted:#6b7280;--dim:#9ca3af;
  --accent:#2563eb;--accent2:#059669;--warn:#f59e0b;--err:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
     background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}

header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
header .brand{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
header h1{margin:0 0 8px;font-size:26px;font-weight:700}
header .sub{color:var(--muted);font-size:14px}

.actions{display:flex;gap:10px;margin:20px 0 28px;flex-wrap:wrap}
.actions a{padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
           color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;transition:.15s}
.actions a:hover{border-color:var(--accent);color:var(--accent)}
.actions a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions a.primary:hover{background:#1d4ed8}
.actions .refresh-btn{padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
                      color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.actions .refresh-btn:hover{color:var(--ink);border-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:center}
.stat .n{font-size:24px;font-weight:700;color:var(--accent)}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:600}

.section-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin:0 0 12px}

.reports-list{display:flex;flex-direction:column;gap:8px}
.report{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 18px;
        text-decoration:none;color:var(--ink);transition:.15s;display:flex;justify-content:space-between;
        align-items:center;gap:16px}
.report:hover{border-color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.05);transform:translateY(-1px)}
.report .r-title{font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:3px}
.report .r-meta{font-size:11.5px;color:var(--muted);font-family:'SF Mono',monospace}
.report .r-arrow{color:var(--dim);font-size:18px;flex-shrink:0}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.loading .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--line);
                   border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;
                   margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.empty, .error{text-align:center;padding:50px 20px;background:var(--panel);border:1px dashed var(--line);
               border-radius:8px}
.empty h3{margin:0 0 8px;color:var(--ink)}
.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.empty code{background:var(--panel2);padding:2px 6px;border-radius:3px;font-family:monospace;font-size:12px}
.error{background:#fef2f2;border-color:#fecaca}
.error h3{color:var(--err)}
.error p{color:#991b1b}

.config-warning{background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:14px 16px;
                margin-bottom:20px;font-size:13px;color:#92400e;line-height:1.6}
.config-warning b{color:#78350f}
.config-warning code{background:#fef9c3;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:12px}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);
       font-size:11.5px;text-align:center}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">Binder OS</div>
  <h1>QA Reports</h1>
  <div class="sub">All QA runs published for team review. Click any report to view detailed results.</div>
</header>

<div class="actions">
  <a href="../qa-tool/qa-tool.html" class="primary">Open QA Tool</a>
  <a href="../README.md">Documentation</a>
  <button class="refresh-btn" onclick="loadReports()">Refresh list</button>
</div>

<div class="stats" id="stats" style="display:none"></div>

<h2 class="section-h">Available reports <span id="report-count"></span></h2>
<div id="content"></div>

<footer>
  Auto-generated listing via GitHub API.
  <span id="last-updated"></span>
</footer>

</div>

<script>
// ============================================================================
// CONFIGURE THESE TWO LINES WITH YOUR GITHUB DETAILS
// ============================================================================
const GITHUB_USER = 'YOUR-USERNAME';   // <-- change this
const GITHUB_REPO = 'binder-qa';       // <-- change this
const BRANCH = 'main';
const REPORTS_PATH = 'qa-reports';
// ============================================================================

const contentEl = document.getElementById('content');
const statsEl = document.getElementById('stats');
const countEl = document.getElementById('report-count');
const updatedEl = document.getElementById('last-updated');

function loadReports(){
  contentEl.innerHTML = '<div class="loading"><span class="spinner"></span>Loading reports from GitHub...</div>';
  statsEl.style.display = 'none';
  countEl.textContent = '';

  if(GITHUB_USER === 'YOUR-USERNAME' || GITHUB_REPO === 'YOUR-REPO'){
    contentEl.innerHTML =
      '<div class="config-warning">' +
      '<b>Configuration needed.</b><br>' +
      'Open this file in a text editor and update these two lines at the top of the &lt;script&gt; block:<br><br>' +
      '<code>const GITHUB_USER = \'YOUR-USERNAME\';</code><br>' +
      '<code>const GITHUB_REPO = \'binder-qa\';</code><br><br>' +
      'Replace <code>YOUR-USERNAME</code> with your GitHub username and <code>binder-qa</code> with your repo name. Save, commit, and push. Refresh this page.' +
      '</div>';
    return;
  }

  const url = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + REPORTS_PATH + '?ref=' + BRANCH;

  fetch(url)
    .then(function(res){
      if(!res.ok){
        if(res.status === 404){ throw new Error('Repository or folder not found. Check GITHUB_USER and GITHUB_REPO in this file.'); }
        if(res.status === 403){ throw new Error('GitHub API rate limit exceeded. Wait a few minutes and refresh.'); }
        throw new Error('HTTP ' + res.status + ': ' + res.statusText);
      }
      return res.json();
    })
    .then(function(files){
      // Filter HTML report files (exclude this index.html itself)
      const reports = files.filter(function(f){
        return f.type === 'file' &&
               f.name.endsWith('.html') &&
               f.name !== 'index.html';
      });

      // Sort by name descending (dates in filenames sort correctly)
      reports.sort(function(a, b){ return b.name.localeCompare(a.name); });

      renderReports(reports);
    })
    .catch(function(err){
      contentEl.innerHTML =
        '<div class="error">' +
        '<h3>Could not load reports</h3>' +
        '<p>' + escapeHtml(err.message) + '</p>' +
        '<p style="margin-top:10px;font-size:12px">If this is a private repository, the GitHub API requires authentication. See the README for options.</p>' +
        '</div>';
    });
}

function renderReports(reports){
  updatedEl.textContent = 'Last updated: ' + new Date().toLocaleString();

  if(reports.length === 0){
    contentEl.innerHTML =
      '<div class="empty">' +
      '<h3>No reports yet</h3>' +
      '<p>Reports will appear here after you generate them in the QA tool and push to GitHub.<br><br>' +
      'Steps:<br>' +
      '1. Open the <code>qa-tool.html</code> and run your QA tests<br>' +
      '2. Click <code>Generate HTML Report</code>. It downloads to your Downloads folder<br>' +
      '3. Move the file into <code>qa-reports/</code> folder<br>' +
      '4. <code>git add qa-reports/ && git commit -m "QA report" && git push</code><br>' +
      '5. Refresh this page</p>' +
      '</div>';
    return;
  }

  countEl.textContent = '(' + reports.length + ')';

  // Stats
  statsEl.style.display = 'grid';
  statsEl.innerHTML =
    '<div class="stat"><div class="n">' + reports.length + '</div><div class="l">Total reports</div></div>' +
    '<div class="stat"><div class="n">' + (parseFilename(reports[0].name).dateStr || '—') + '</div><div class="l">Latest run</div></div>' +
    '<div class="stat"><div class="n">' + formatSize(reports.reduce(function(s,r){return s+(r.size||0);}, 0)) + '</div><div class="l">Total size</div></div>';

  // Report list
  const listHtml = reports.map(function(r){
    const parsed = parseFilename(r.name);
    const rawUrl = 'https://' + GITHUB_USER + '.github.io/' + GITHUB_REPO + '/' + REPORTS_PATH + '/' + r.name;
    return '<a href="' + escapeHtml(rawUrl) + '" class="report">' +
             '<div>' +
               '<div class="r-title">' + escapeHtml(parsed.title) + '</div>' +
               '<div class="r-meta">' + escapeHtml(parsed.dateStr) + ' · ' + formatSize(r.size||0) + ' · ' + escapeHtml(r.name) + '</div>' +
             '</div>' +
             '<div class="r-arrow">→</div>' +
           '</a>';
  }).join('');

  contentEl.innerHTML = '<div class="reports-list">' + listHtml + '</div>';
}

function parseFilename(name){
  // Filename patterns:
  //   binder-qa-<label>-<YYYY-MM-DD>.html
  //   <anything>.html
  const stripped = name.replace(/\.html$/i, '');

  // Try to extract date at end (YYYY-MM-DD)
  const dateMatch = stripped.match(/(\d{4}-\d{2}-\d{2})$/);
  const dateStr = dateMatch ? dateMatch[1] : '';

  // Extract title
  let title = stripped;
  if(dateMatch){
    title = stripped.slice(0, -dateMatch[0].length - 1); // remove -YYYY-MM-DD
  }
  title = title.replace(/^binder-qa-/i, '').replace(/-/g, ' ');
  title = title.charAt(0).toUpperCase() + title.slice(1);
  if(!title) title = stripped;

  return { title, dateStr };
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadReports();
</script>
</body>
</html>
